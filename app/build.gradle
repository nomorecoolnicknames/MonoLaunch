plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monobogdan.monolaunch'
    compileSdk 33

    defaultConfig {
        applicationId "com.monobogdan.monolaunch"
        minSdk 16
        // CT07: 22, so the SMS and call log permissions are granted at install.
        targetSdk 22
        versionCode 2
        versionName "1.03 a.i.v"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        // CT07: targetSdk 22 is intentional.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {

}
